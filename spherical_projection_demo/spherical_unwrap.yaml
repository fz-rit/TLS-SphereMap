input_ply: "C:\\mylab\\data\\through_lidar_eye_demo\\33_01_filtered_normaled_curvature_0.06_roughness_0.06_segmap.ply"
out_dir: "C:\\mylab\\data\\through_lidar_eye_demo\\sphere_proj_demo"

fields:
  azimuth: "azimuth"
  zenith: "zenith"          # use zenith for spherical projection
  angles_in_degrees: true

ranges:
  az_min: 0.0
  az_max: 360.0
  ze_min: 0.0
  ze_max: "auto"  # Auto-detect from data, or specify explicit value (e.g., 135.0)

grid:
  angular_resolution: 0.25  # degrees per pixel (adaptive width/height based on angular ranges)

progress:
  step_degrees: 0.5       # Angular step per frame (degrees)
  frames_to_have: "100"    # Number of exported frames: "10", "20", etc., or "max" for all steps
  tls_dual_scan: true     # TLS scans opposite azimuths simultaneously (180° physical rotation covers 360°)

projection:
  mode: "scalar"          # "count" (density) or "scalar" (field values)
  scalar_field: "range1metres"
  agg: "mean"             # Aggregation: mean/max/min/median

render:
  cmap: "hot"
  dpi: 180
  vmax_percentile: 99.5
  draw_progress_line: true
  save_individual_frames: false  # Set to true to save individual PNG frames
  gif_duration_ms: 100  # Milliseconds per frame in GIF
  gif_loop: 0  # 0 = infinite loop


render3d:
  enabled: true
  side_subdir: "frames_3d_side"
  top_subdir: "frames_3d_top"
  width: 1280
  height: 720
  point_size: 2.0
  background_rgb: [0, 0, 0]
  max_points: 200000  # Random sample cap for performance; null to disable
