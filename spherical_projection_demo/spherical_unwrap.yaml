input_ply: "C:\\mylab\\data\\through_lidar_eye_demo\\33_01_filtered_normaled_curvature_0.06_roughness_0.06_segmap.ply"
out_dir: "C:\\mylab\\data\\through_lidar_eye_demo\\sphere_proj_demo"

fields:
  azimuth: "azimuth"
  zenith: "zenith"          # use zenith for spherical projection
  angles_in_degrees: true

ranges:
  az_min: 0.0
  az_max: 360.0
  ze_min: 0.0
  ze_max: "auto"            # <- infer from data (e.g., 135.0251)

grid:
  width: 720
  height: 180               # can stay fixed; ze_max decides how much of it is “used”

progress:
  step_cols: 2
  frames_to_have: "20"  # "10", "20", ... = number of exported frames; "max" = all steps

# What to draw in the image:
# - count: density buildup (great for “lighting up columns” demo)
# - mean/max of a scalar: range image / intensity image
projection:
  mode: "scalar"             # "count" or "scalar"
  scalar_field: "range1metres"  # used only if mode="scalar"
  agg: "mean"               # mean/max/min/median

render:
  cmap: "hot"
  dpi: 180
  vmax_percentile: 99.5
  draw_progress_line: true  # vertical line showing current az column


render3d:
  enabled: true
  side_subdir: "frames_3d_side"
  top_subdir: "frames_3d_top"
  width: 1280
  height: 720
  point_size: 2.0
  background_rgb: [0, 0, 0]
  max_points: 200000  # Random sample cap for performance; null to disable
